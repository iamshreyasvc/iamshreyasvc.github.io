<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SVC.">
	<defs>
		<style>
			.svc-favicon-bg {
				fill: #f3f5f7;
			}
			.svc-favicon-text {
				fill: #0c1222;
			}
			.svc-favicon-dot {
				fill: #dc2626;
			}
			@media (prefers-color-scheme: dark) {
				.svc-favicon-bg {
					fill: #161b22;
				}
				.svc-favicon-text {
					fill: #f0f6fc;
				}
				.svc-favicon-dot {
					fill: #f87171;
				}
			}
		</style>
	</defs>
	<rect class="svc-favicon-bg" width="128" height="128" />
	<text
		x="64"
		y="64"
		text-anchor="middle"
		dominant-baseline="central"
		font-family="ui-monospace, Menlo, Monaco, Consolas, 'Courier New', monospace"
		font-size="42"
		font-weight="600"
		class="svc-favicon-text"
		letter-spacing="-0.06em"
	>
		SVC<tspan class="svc-favicon-dot">.</tspan>
	</text>
</svg>
