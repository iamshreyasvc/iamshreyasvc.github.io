<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Shreyas V Chandramouli</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .projects-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px;
      transition: border-color 0.25s, transform 0.25s;
      position: relative;
      overflow: hidden;
    }
    .project-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
    }
    .project-card:hover { border-color: var(--border); transform: translateY(-3px); }
    .project-card:hover::before { transform: scaleX(1); }
    .project-card-num {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }
    .project-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--white);
      margin-bottom: 12px;
    }
    .project-card p { font-size: 0.87rem; color: #7a7568; line-height: 1.7; margin-bottom: 20px; }
    .project-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .project-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .project-card-placeholder {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 180px;
    }
    .project-card-placeholder span {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--border);
    }
    @media (max-width: 768px) {
      .projects-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-num">01</span>
