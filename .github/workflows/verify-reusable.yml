# Shared checks for CI and deploy pipelines.
name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check and unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/admin/index.html
          test -f dist/research/index.html
          test -f dist/projects/index.html
          test -f dist/resume/index.html
          grep -q 'Shreyas' dist/index.html
